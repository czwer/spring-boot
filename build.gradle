plugins {
	id "base"
	id "org.jetbrains.kotlin.jvm" apply false // https://youtrack.jetbrains.com/issue/KT-30276
}

description = "Spring Boot Build"

defaultTasks 'build'

allprojects {
	group = "org.springframework.boot"
}

subprojects {
	apply plugin: "org.springframework.boot.conventions"

	repositories {
		mavenLocal()
		mavenCentral()
		spring.mavenRepositories()
	}

	configurations.all {
		resolutionStrategy.cacheChangingModulesFor 0, "minutes"
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

gradle.taskGraph.whenReady { taskGraph ->
	// 排除所有与文档生成和示例运行相关的特定任务
	taskGraph.allTasks.findAll { task ->
		// 使用正则表达式匹配要排除的任务名
		def taskName = task.name
		(taskName.contains('dokkatooGeneratePublicationHtml') ||
				taskName.contains('runRemoteSpringApplicationExample') ||
				taskName.contains('runLoggingFormatExample') ||
				taskName.contains('runSpringApplicationExample')) &&
				task.project.path == ':spring-boot-project:spring-boot-docs' // 可选：指定模块路径确保精确性
	}.each { taskToExclude ->
		taskToExclude.enabled = false // 禁用这些任务
		logger.lifecycle("Task excluded: ${taskToExclude.path}") // 打印日志确认
	}
}